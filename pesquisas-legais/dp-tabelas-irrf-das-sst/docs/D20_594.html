      animation-name: carregando;
      animation-duration: 1s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;

      0% {
        transform: scale(1, 1);
      }

      25% {
        transform: scale(0.75, 0.75);
      }

      50% {
        transform: scale(0.5, 0.5);
      }

      75% {
        transform: scale(0.75, 0.75);
      }

        transform: scale(1, 1);
      }
    }
