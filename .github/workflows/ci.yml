name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server – typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Dummy values so module-load and Prisma generate succeed in CI. Tests mock OpenAI/Qdrant and use
    # an isolated SQLite file (set by test/jest.setupEnv.ts), so no real credentials are needed.
    # JWT_SECRET dummy is 32+ chars: lib/jwt.ts fail-closes on shorter secrets.
    env:
      OPENAI_API_KEY: ci-dummy-openai-key
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef
      DATABASE_URL: file:./ci.db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Sem postinstall no server/ → `npm ci` NÃO gera o client. tsc contra um client stale
      # produz os 35 erros de accounting/repositories/ReconciliationRepository.ts (schema TEM
      # os modelos; faltava só o generate reproduzível). Este passo fecha o gap P2.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck tests (tsconfig.test.json)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint (layer-gate)
        run: npm run lint

      # Gate de governança C5 — dívida SUPRIMIDA (medida pelo ESLint) × dívida DECLARADA
      # (bloco debt-ledger do spec). O passo acima barra violação SEM supressão; este barra
      # a supressão que não corresponde mais a nada, o spec que declara dívida já paga, e a
      # violação silenciada por inline config (`/* eslint <regra>: "off" */`), que não deixa
      # marcador nenhum. Roda AQUI e não em job próprio: precisa do node_modules que este job
      # já instalou, e assim herda o required status check deste contexto.
      # Origem: dimensão C5 do instrumento AV-L1 (docs/audit/bancada.html).
      - name: Debt ledger matches spec (governance C5)
        run: node ../scripts/debt-ledger-check.mjs --root server

      - name: Run tests
        run: npm test

      # Tripwire p/ TECH-DEBT-TEST-001. `npm test` usa `--forceExit`: quando um recurso async
      # (subprocesso do query-engine do Prisma nos testes de integração SQLite) demora a fechar
      # e corre com a janela de saída do worker do Jest, o exit vira 1 mesmo com 900/900 verdes
      # (flake de ambiente, não do diff — provado localmente: 0 handles sob --detectOpenHandles).
      # forceExit poderia MASCARAR um teste que de fato vaze handle → este passo re-roda a suíte
      # com o detector e FALHA se o Jest reportar qualquer open handle. Base limpa = verde.
      - name: Assert no leaked handles (forceExit tripwire)
        shell: bash
        run: |
          set -uo pipefail
          out=$(npm run test:leaks 2>&1) || { echo "$out"; exit 1; }
          if echo "$out" | grep -q "Jest has detected the following"; then
            echo "::error::Open handle vazado — algum teste não fecha um recurso async (TECH-DEBT-TEST-001)."
            echo "$out" | grep -A15 "Jest has detected the following"
            exit 1
          fi
          echo "OK: nenhum handle vazado."

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (layer-gate)
        run: npm run lint:gate

      # Metade frontend do gate C5 — ver o comentário no job `server`.
      - name: Debt ledger matches spec (governance C5)
        run: node ../scripts/debt-ledger-check.mjs --root my-app

      - name: Build
        run: npm run build

      # Vitest NUNCA rodava no CI (job só fazia lint:gate + build) → os guards de
      # date-only off-by-one (PRs #50/#52) não executavam. E o CI roda em UTC, onde
      # o bug de UTC-shift fica MASCARADO. Pinar TZ=America/Sao_Paulo (UTC-3) SÓ neste
      # passo faz os guards morderem sem alterar o comportamento de dev local.
      - name: Run tests (vitest)
        run: npm test
        env:
          TZ: America/Sao_Paulo

  # Gate de governança de skills. `skill-audit run --all` é determinístico (estático: validate +
  # governance-check + sync-metadata + coverage + eval-estrutural + controls + self-check) — sem
  # model-in-loop, roda em < 1s. Barra drift: regra sem gate, gate órfão, eval-score divergente do
  # REPORT, controle que deixou de discriminar, ou self-check do auditor quebrado. A varredura
  # COMPORTAMENTAL (re-geração via subagente / `/skill-audit --sweep`) continua human-run, fora do CI.
  # Precisa do `typescript` de server/ para as assertions AST (ast-jsx/ast-import/ast-noclass).
  skill-governance:
    name: Skill governance – skill-audit run --all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps (typescript for AST assertions)
        working-directory: server
        run: npm ci

      - name: skill-audit run --all (0 findings required)
        run: node .claude/skills/skill-audit/skill-audit.mjs run

  # Gate de PRESENÇA da camada de governança operacional (OPS-001..004). O `skill-audit` acima
  # cobre drift interno das skills, mas NÃO garante que os artefatos-âncora existam — docs/skills
  # podem regredir silenciosamente (gap P1 do teste de sistema 2026-07-07). Este job falha se:
  #   • .claude/skills/_OPERATING-GATES.md sumir, OU
  #   • a referência "Gates de envio OPS-001" sair do reviewer OU do implementer.
  # NOTA: bloqueante desde já (decisão do usuário). Fica VERMELHO até PR #44 (camada OPS-001)
  # ser mergeada em main — os três alvos ainda não estão em main na criação deste workflow.
  governance-presence:
    name: Governance – OPS-001 layer present
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — `review-ledger-check.mjs` imprime a razão declarado/merges, e
      # `git log --merges` num checkout shallow devolveria um número ERRADO em silêncio (o
      # script detecta shallow e OMITE o número em vez de estimar, mas a resposta certa é
      # dar-lhe a história). Mesmo custo já aceito pelo job `zinc-guard` deste arquivo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert operating-gates layer exists
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          [ -f .claude/skills/_OPERATING-GATES.md ] || { echo "::error::.claude/skills/_OPERATING-GATES.md ausente (camada OPS-001)."; fail=1; }
          grep -q "Gates de envio OPS-001" .claude/skills/luminaris-reviewer/SKILL.md    || { echo "::error::reviewer SKILL.md sem 'Gates de envio OPS-001'."; fail=1; }
          grep -q "Gates de envio OPS-001" .claude/skills/luminaris-implementer/SKILL.md || { echo "::error::implementer SKILL.md sem 'Gates de envio OPS-001'."; fail=1; }
          [ "$fail" = 0 ] && echo "OK: camada de governança OPS-001 presente."
          exit "$fail"

      # Runtime para o passo seguinte. Este job era checkout+bash puro; `node` não estava
      # garantido nele, e a convenção deste arquivo é pinar a versão em vez de herdar a da
      # imagem do runner. Sem `cache: npm`: o gate abaixo não instala nada.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Gate da BANCADA aplicada a si mesma — 16 checagens que reprovam (B1..B9 e B11..B17;
      # B10 só emite aviso) sobre
      # docs/audit/bancada.html e os JSON de docs/audit/ (envelope auditoria/1.1, triagem/1.0,
      # srcId que resolve, bloco órfão, isenção 4b/6b com lastro).
      # Origem: item 6 de docs/audit/CONTINUACAO.md — o script existia e não rodava em lugar
      # nenhum além da mão de quem lembra, que é a mesma classe do achado F4 do R1 (barreira
      # declarada sem rastro executável) aplicada à própria bancada.
      # Roda AQUI, e não junto do irmão `debt-ledger-check.mjs`: aquele mora nos jobs server/
      # my-app porque PRECISA do node_modules que eles instalam — este só usa builtins do Node
      # e lê docs/audit/ + scripts/, então prendê-lo a um `npm ci` de que não depende faria a
      # falha de instalação alheia mascarar o gate. Este job é o mais barato do arquivo
      # (checkout + bash) e já é um status check de governança.
      # Sem filtro de `paths`: uma mudança em scripts/ quebra o gate sem tocar docs/audit/, e
      # filtrar por caminho deixaria passar exatamente essa quebra. O workflow roda em todo
      # push/PR — mantido assim de propósito.
      - name: Bancada aplicada a si mesma (AV-00 · 16 checagens)
        run: node scripts/bancada-gate.mjs

      # Razão de revisão independente — um veredito declarado POR PR.
      # Origem: achado R1 F4 `revisao-independente-sem-artefato-por-merge`
      # (TRIAGEM-R1-R3.json, rank 6; 9 menções em prosa contra 207 merges). O `barrier_note`
      # da triagem já concluía que «a barreira que falta é de REGISTRO, não de ferramenta»:
      # nenhum passo deste arquivo exigia artefato de revisão.
      # O gate NÃO exige aprovação — `sem_revisao_independente` é veredito legítimo da lista
      # fechada. Ele converte AUSÊNCIA DE DECLARAÇÃO em DECLARAÇÃO DE AUSÊNCIA e reprova
      # registro ambíguo (PR duplicado), auto-revisão (reviewer == implementer, §9.4) e
      # artefato apontando caminho que não existe.
      # Mora neste job pela mesma razão do irmão acima: só usa builtins do Node e lê
      # docs/audit/ + git, então não depende de nenhum `npm ci` cuja falha o mascararia.
      - name: Revisão independente declarada por PR (R1 F4)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/review-ledger-check.mjs

  # Diff-scoped design gate. A base ainda tem ~33 ocorrências de `zinc-` pré-existentes
  # (contrato §4: superfícies dark = neutral-*). Em vez de reprovar nelas (refactor =
  # fatia própria), este job falha SÓ quando a mudança INTRODUZ um `zinc-` novo — mesmo
  # princípio do layer-gate: barra regressão, não força o pagamento da dívida existente.
  # Backlog mensurável: `grep -rn "zinc-" my-app/{features,lib,components,pages,styles}`.
  zinc-guard:
    name: Design – no new zinc-
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on newly-added zinc- (use neutral-* per contract §4)
        shell: bash
        run: |
          set -uo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF}"
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="${GITHUB_SHA}~1"
          fi
          ADDED=$(git diff --unified=0 "${BASE}...${GITHUB_SHA}" -- \
                    'my-app/**/*.ts' 'my-app/**/*.tsx' 'my-app/**/*.css' 'my-app/**/*.scss' \
                  | grep -E '^\+' | grep -v '^\+\+\+' | grep 'zinc-' || true)
          if [ -n "${ADDED}" ]; then
            echo "::error::New 'zinc-' introduced — dark surfaces must use neutral-* (contract §4)."
            echo "${ADDED}"
            exit 1
          fi
          echo "OK: no new zinc- added."
