version: 2

# Minor/patch agrupados num PR por ecossistema (menos ruído); major chega em PR próprio.
# Major de @types/node e da imagem node fica de fora: a versão do runtime é decisão do .nvmrc
# (hoje 22), não do Dependabot — tipos de Node 24 num runtime 22 deixam passar API que não existe.
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /my-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      my-app-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Mantém os SHAs fixados no ci.yml atualizados (o comentário "# vX.Y.Z" é reescrito junto).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/server, /my-app]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
