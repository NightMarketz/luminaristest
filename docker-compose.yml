version: "3.9"

services:
  server:
    # Schema aplicado por `npm run deploy:migrate` (server/package.json → scripts/migrate-deploy.mjs)
    # ANTES deste `docker compose up`/swap de container — NUNCA por este serviço. ADR-M2-deploy-
    # topology.md §2 decisão 4 (ratificada pelo dono): migração é etapa SEPARADA do pipeline, nunca
    # entrypoint/CMD que migra no boot — não reintroduza essa chamada aqui.
    build:
      # Contexto na raiz: o lockfile do workspace npm é um só, na raiz (PR-3 do MONOREPO-WORKSPACES).
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: file:/data/dev.db
      # RAG-PR-A (BE-INCR-RAG-DOCUMENTOS item 12; dono, 2026-11-06: "vec0 em arquivo próprio"): o índice de vetores
      # é um SEGUNDO arquivo SQLite, no MESMO volume do banco (sqlite_data) — o backup do /data leva os dois.
      VECTOR_DB_PATH: /data/vectors.db
      # config/env.ts:163-164 lê ATTACHMENTS_DIR e cai em <cwd>/storage/attachments quando
      # ausente — cwd do processo é o WORKDIR do Dockerfile (/app), então o default seria
      # /app/storage/attachments: caminho dentro do FILESYSTEM DO CONTAINER, sem volume nenhum
      # por baixo. Todo `docker compose up --build` recria a camada gravável e apaga os anexos
      # (comprovante fiscal do módulo contábil incluído). Setar explícito ao mesmo valor que o
      # default já resolve hoje, e montar o volume nesse caminho absoluto, elimina a dependência
      # SILENCIOSA do cwd/WORKDIR — se o WORKDIR do Dockerfile mudar amanhã, o caminho montado
      # aqui não muda junto por acidente.
      ATTACHMENTS_DIR: /app/storage/attachments
      # app.ts:27 lê ALLOWED_ORIGIN direto de process.env (fora do schema Zod de env.ts, que não
      # a valida) com fallback para http://localhost:3000 — em produção isso não derruba o boot,
      # só bloqueia silenciosamente todo request do frontend real. Igual ao ALERT_WEBHOOK_URL abaixo,
      # `:?` força a decisão explícita no .env da instância em vez de deixar o default errado
      # passar despercebido até o primeiro CORS-fail em produção.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?defina ALLOWED_ORIGIN no .env ao lado deste arquivo — sem ela o CORS cai no default http://localhost:3000 e bloqueia silenciosamente o frontend em qualquer host real}
      # Nó OBS, Fase B, item 15 (PRE-ADR-OBSERVABILIDADE §5; dono, 2026-10-24: "Também trava no compose"):
      # lib/alertWebhook.ts é no-op silencioso sem a URL, então em produção falha de job e do processo
      # sumiria sem aviso. Obrigatória aqui; continua opcional em dev (server/.env.example).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?defina ALERT_WEBHOOK_URL no .env ao lado deste arquivo — sem ela falha de job e do processo não alerta ninguém em produção}
      # Nó OBS, Fase B, itens 11/13: o registro de acesso do Marco Civil guarda 6 meses (Lei 12.965/2014,
      # art. 15). Sem a variável, lib/accessLog.ts resolve /app/logs/access a partir de __dirname — camada
      # gravável do container, apagada a cada `up --build`. Mesmo motivo do ATTACHMENTS_DIR acima: caminho
      # explícito + volume nesse caminho. Encriptação e papel nomeado (art. 13) seguem no item 12 (Onda 0).
      LOG_ACCESS_DIR: /app/logs/access
    volumes:
      - sqlite_data:/data
      - attachments_data:/app/storage/attachments
      - access_logs:/app/logs/access
    restart: unless-stopped

  frontend:
    build:
      # Contexto na raiz: o lockfile do workspace npm é um só, na raiz (PR-3 do MONOREPO-WORKSPACES).
      context: .
      dockerfile: my-app/Dockerfile
      args:
        # DUAS coisas estavam erradas aqui, e consertar só a primeira declararia vitória:
        # (1) o nome. O código lê NEXT_PUBLIC_API_BASE_URL em 19 arquivos; ninguém lê
        #     NEXT_PUBLIC_API_URL — medido, e um é prefixo do outro, então o zero é forte.
        # (2) o momento. NEXT_PUBLIC_* é INLINADO no bundle em tempo de BUILD
        #     (my-app/next.config.js:23 lê process.env quando `npm run build` roda, dentro
        #     do estágio builder do Dockerfile). A chave `environment:` é RUNTIME: com o
        #     nome certo e no lugar errado o valor continuaria sem efeito nenhum. Por isso
        #     build-arg, e por isso o serviço não tem mais bloco `environment:`.
        # O default abaixo é o MESMO de next.config.js:23 — não inventa topologia. Note que
        # o valor precisa do sufixo /api (lib/services/document.service.ts:28 concatena
        # `${BASE}/documents/upload`) e precisa ser resolvível PELO NAVEGADOR, não pela rede
        # do compose: o `http://server:3001` que estava aqui falhava nos dois pontos.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  sqlite_data:
  attachments_data:
  access_logs:
