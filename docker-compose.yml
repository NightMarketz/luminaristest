version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: file:/data/dev.db
      QDRANT_URL: http://qdrant:6333
      # lib/vector/qdrant.ts monta o cliente com `apiKey: process.env.QDRANT_API_KEY!` —
      # sem esta linha o cliente sobe sem credencial e o índice fica aberto a quem alcançar
      # o host (as portas do serviço qdrant abaixo são publicadas).
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - sqlite_data:/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://server:3001
    depends_on:
      - server
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      # As duas portas acima são publicadas no HOST. Sem esta variável o Qdrant sobe com a
      # API aberta: leitura do conteúdo indexado (divulgação, que não se desfaz) e
      # escrita/delete da coleção para quem alcançar a máquina. `:?` é deliberado — faz
      # `docker compose up` RECUSAR subir sem chave, porque server/src/config/env.ts declara
      # QDRANT_API_KEY como `.optional()` e portanto nada no boot da aplicação recusaria.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?defina QDRANT_API_KEY no .env ao lado deste arquivo — o Qdrant publica 6333/6334 no host e sobe sem autenticacao nenhuma se ela faltar}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  sqlite_data:
  qdrant_data:
